{% extends "base.html" %}

{% block title %}Вход — Molven RP{% endblock %}

{% block content %}
<section class="login-section">
  <div class="login-box">
    <h2>Личный кабинет</h2>
    <form id="loginForm">
      <label for="nick">Никнейм</label>
      <input type="text" id="nick" name="nick" placeholder="Введите ник">

      <label for="password">Пароль</label>
      <div class="password-wrapper">
        <input type="password" id="password" name="password" placeholder="Введите пароль">
        <button type="button" class="toggle-password" onclick="togglePassword()">
          <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>

      <button type="submit" class="btn">Войти</button>
    </form>
    <p class="hint">Просто для теста, без подключения к серверу</p>
  </div>
</section>

<!-- Полупрозрачная подложка + уведомление -->
<div id="alertOverlay" class="alert-overlay">
  <div id="alertBox" class="alert-box">
    ⚠️ Авторизация пока не работает<br>Сервер в разработке
  </div>
</div>

<script>
function togglePassword() {
  const input = document.getElementById("password");
  const icon = document.getElementById("eyeIcon");
  if (input.type === "password") {
    input.type = "text";
    icon.innerHTML = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.76 21.76 0 0 1 5.06-6.88"/><path d="M1 1l22 22"/>';
  } else {
    input.type = "password";
    icon.innerHTML = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path><circle cx="12" cy="12" r="3"></circle>';
  }
}

document.getElementById("loginForm").addEventListener("submit", function(event) {
  event.preventDefault();
  const overlay = document.getElementById("alertOverlay");
  overlay.classList.add("show");
  setTimeout(() => overlay.classList.remove("show"), 3000);
});
</script>
{% endblock %}
