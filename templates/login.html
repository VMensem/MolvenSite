{% extends "base.html" %}
{% block title %}Вход — Molven RP{% endblock %}

{% block content %}
<section class="login-section">
  <div class="login-box">
    <h2>Личный кабинет</h2>
    <form id="loginForm">
      <label for="nick">Никнейм</label>
      <div class="input-wrapper">
        <input type="text" id="nick" name="nick" placeholder="Введите ник">
      </div>

      <label for="password">Пароль</label>
      <div class="password-wrapper">
        <input type="password" id="password" name="password" placeholder="Введите пароль">
        <button type="button" class="toggle-password" onclick="togglePassword()">
          <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>

      <button type="submit" class="btn">Войти</button>
    </form>
    <p class="hint">Авторизация временно недоступна — сервер в разработке 🚧</p>
  </div>

  <!-- уведомление -->
  <div id="alertOverlay" class="alert-overlay">
    <div class="alert-box">
      Авторизация временно недоступна<br>Сервер в разработке 🚧
    </div>
  </div>
</section>
{% endblock %}
