<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Molven RolePlay — CRMP Project{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

<header>
  <div class="container nav">
    <div class="brand">
      <a href="/" class="logo">
        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Molven RP">
      </a>
      <div class="project-info">
        <a href="/" class="project-title">Molven RolePlay</a>
        <div class="project-subtitle">CRMP Project</div>
      </div>
    </div>

    <nav>
      <button class="menu-toggle" onclick="toggleMenu()">☰</button>
      <ul id="navlist">
        <li><a href="/">Главная</a></li>
        <li><a href="https://forum.molven-rp.com" target="_blank">Форум</a></li>
        <li><a href="https://help.molven-rp.com" target="_blank">Помощь</a></li>
        <li><a href="/#news">Новости</a></li>
        <li><a href="/#game">Лаунчеры</a></li>
        <li><a href="/donate">Донат</a></li>
        <li><a href="/login">Личный кабинет</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="container">
  {% block content %}{% endblock %}
</main>

<footer>
  <div class="container footer-container">
    <div class="footer-left">
      <span class="muted">© <a href="https://molven-rp.com">Molven RolePlay</a> — Все права защищены.</span>
    </div>
    <div class="footer-right">
      <a href="https://vk.com/molvenproject" target="_blank" class="social-icon">
        <img src="https://cdn-icons-png.flaticon.com/512/145/145813.png" alt="VK">
      </a>
      <a href="https://t.me/molvenrp" target="_blank" class="social-icon">
        <img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png" alt="Telegram">
      </a>
      <a href="https://dsc.gg/molvenrp" target="_blank" class="social-icon">
        <img src="https://cdn-icons-png.flaticon.com/512/2111/2111370.png" alt="Discord">
      </a>
    </div>
  </div>
</footer>
<script>
  function toggleMenu() {
    document.getElementById("navlist").classList.toggle("active");
  }
</script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
